<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Monitor Da Vinci Style Logo</title>
  <desc id="desc">A minimal sepia line logo combining Vitruvian construction geometry, an eye, and a terminal prompt.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#FBF6E8"/>
      <stop offset="100%" stop-color="#E8D9B8"/>
    </radialGradient>
    <style>
      .paper { fill: url(#paper); }
      .construct { stroke: #8A6B3E; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .22; }
      .ink { stroke: #3F3020; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { stroke: #3F3020; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; opacity: .82; }
      .accent { stroke: #557158; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .fill-ink { fill: #3F3020; }
      .fill-accent { fill: #557158; }
    </style>
  </defs>

  <rect class="paper" width="1024" height="1024" rx="156"/>

  <g aria-hidden="true">
    <rect class="construct" x="174" y="174" width="676" height="676" rx="22"/>
    <circle class="construct" cx="512" cy="512" r="338"/>
    <path class="construct" d="M512 176V848"/>
    <path class="construct" d="M176 512H848"/>
  </g>

  <g>
    <path class="ink" d="M278 512C333 418 425 368 512 368C599 368 691 418 746 512C691 606 599 656 512 656C425 656 333 606 278 512Z"/>
    <circle cx="512" cy="512" r="84" fill="#F4E8CE" stroke="#3F3020" stroke-width="20"/>
    <path class="accent" d="M472 480L518 512L472 544"/>
    <path class="accent" d="M542 544H596"/>
    <circle class="fill-ink" cx="512" cy="512" r="13"/>
  </g>

  <g aria-hidden="true">
    <path class="ink-thin" d="M364 730C409 758 459 772 512 772C565 772 615 758 660 730"/>
    <path class="ink-thin" d="M364 294C409 266 459 252 512 252C565 252 615 266 660 294"/>
    <circle class="fill-accent" cx="512" cy="156" r="11"/>
    <circle class="fill-accent" cx="512" cy="868" r="11"/>
    <circle class="fill-accent" cx="156" cy="512" r="11"/>
    <circle class="fill-accent" cx="868" cy="512" r="11"/>
  </g>
</svg>
