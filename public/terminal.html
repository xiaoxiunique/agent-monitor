<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agent Terminal</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/terminal.css" />
  </head>
  <body>
    <main class="terminal-shell">
      <div class="terminal-status">
        <span id="terminalState">connecting</span>
        <div class="terminal-actions">
          <button type="button" id="keyboardButton">Keyboard</button>
          <button type="button" id="fitButton" aria-label="Fit terminal">Fit</button>
          <button type="button" id="reconnectButton" aria-label="Reconnect terminal">Reconnect</button>
        </div>
      </div>
      <div id="terminalMount" class="terminal-mount"></div>
      <div class="terminal-keys">
        <button type="button" data-key="esc">Esc</button>
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="enter">Enter</button>
        <button type="button" data-key="backspace">Back</button>
        <button type="button" data-key="ctrl-d">Ctrl-D</button>
        <button type="button" data-key="ctrl-c">Ctrl-C</button>
        <button type="button" data-key="ctrl-u">Ctrl-U</button>
        <button type="button" data-key="up">Up</button>
        <button type="button" data-key="left">Left</button>
        <button type="button" data-key="down">Down</button>
        <button type="button" data-key="right">Right</button>
      </div>
    </main>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/terminal.js" type="module"></script>
  </body>
</html>
